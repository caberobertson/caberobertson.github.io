name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is covered by the deploy workflow
  workflow_dispatch:

jobs:
  build:
    name: Build, type-check, validate & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Type-check Astro components and content schemas
        run: npm run check
      - run: npm run validate
      - run: npm test
